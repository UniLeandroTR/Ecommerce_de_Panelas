# configuracao do bd
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = leepans
quarkus.datasource.password = 123456
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/ecommerce

 quarkus.hibernate-orm.database.generation=drop-and-create
# quarkus.hibernate-orm.database.generation=none
# quarkus.hibernate-orm.database.generation=update


quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# JWT
mp.jwt.verify.publickey.location=META-INF/resources/public.pem
mp.jwt.verify.issuer=Ecommerce-de-Panelas
smallrye.jwt.sign.key.location=META-INF/resources/private.pem

#Redis Cache
quarkus.redis.hosts=redis://localhost/

# Argon2id - parâmetros recomendados OWASP 2024
app.security.argon2.iterations=3
app.security.argon2.memory=65536
app.security.argon2.parallelism=4
app.security.argon2.hash-length=32
app.security.argon2.salt-length=16