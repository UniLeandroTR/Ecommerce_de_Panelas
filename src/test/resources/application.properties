quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:panelas_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.datasource.username=sa
quarkus.datasource.password=

# quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

mp.jwt.verify.publickey.location=META-INF/resources/public.pem
mp.jwt.verify.issuer=Ecommerce-de-Panelas
smallrye.jwt.sign.key.location=META-INF/resources/private.pem

quarkus.redis.hosts=redis://localhost:6379
quarkus.mailer.mock=true

app.security.argon2.iterations=1
app.security.argon2.memory=4096
app.security.argon2.parallelism=1
app.security.argon2.hash-length=32
app.security.argon2.salt-length=16

app.api.problem-base-uri=urn:leepans:errors
