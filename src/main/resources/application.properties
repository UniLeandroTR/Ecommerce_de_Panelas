# Configuracao do Banco de Dados
quarkus.datasource.db-kind=${DB_KIND}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}

quarkus.hibernate-orm.database.generation=drop-and-create
# quarkus.hibernate-orm.database.generation=none
# quarkus.hibernate-orm.database.generation=update

quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# JWT
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
mp.jwt.verify.issuer=${JWT_ISSUER}
smallrye.jwt.sign.key.location=${JWT_SIGN_KEY_LOCATION}

# Redis Cache
quarkus.redis.hosts=${REDIS_HOSTS}

# Argon2id - parametros recomendados OWASP 2024
app.security.argon2.iterations=${ARGON2_ITERATIONS}
app.security.argon2.memory=${ARGON2_MEMORY}
app.security.argon2.parallelism=${ARGON2_PARALLELISM}
app.security.argon2.hash-length=${ARGON2_HASH_LENGTH}
app.security.argon2.salt-length=${ARGON2_SALT_LENGTH}

# Mailer
quarkus.mailer.mock=false
quarkus.mailer.host=${MAILER_HOST}
quarkus.mailer.port=${MAILER_PORT}
quarkus.mailer.ssl=${MAILER_SSL}
quarkus.mailer.tls=${MAILER_TLS}
quarkus.mailer.username=${MAILER_USERNAME}
quarkus.mailer.password=${MAILER_PASSWORD}
quarkus.mailer.from=${MAILER_FROM}